# fetch-blogs — production-equivalent Docker Compose
# Run from: cd fetch-blogs && docker compose up
#
# Local dev:  docker compose up             (auto-merges override.yml)
# Production: docker compose -f docker-compose.yml up -d

version: "3.9"

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [app-net]
  restart: unless-stopped

services:

  # ── FastAPI API + APScheduler ────────────────────────────────────────────────
  fastapi-api:
    <<: *worker-common
    command: >
      sh -c "bash scripts/prestart.sh &&
             fastapi run --workers 4 src/main.py"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery Workers — one container per queue ─────────────────────────────────
  celery-scrape:
    <<: *worker-common
    command: >
      celery -A src.workers.celery_app worker
      -Q scrape_queue -c 4 -n scrape@%h --loglevel=info

  celery-extract:
    <<: *worker-common
    command: >
      celery -A src.workers.celery_app worker
      -Q extract_queue -c 2 -n extract@%h --loglevel=info

  celery-rank:
    <<: *worker-common
    command: >
      celery -A src.workers.celery_app worker
      -Q rank_queue -c 2 -n rank@%h --loglevel=info

  celery-generate:
    <<: *worker-common
    command: >
      celery -A src.workers.celery_app worker
      -Q generate_queue -c 2 -n generate@%h --loglevel=info --time-limit=700

  celery-publish:
    <<: *worker-common
    command: >
      celery -A src.workers.celery_app worker
      -Q publish_queue -c 4 -n publish@%h --loglevel=info

  # ── Celery Flower — monitoring dashboard ─────────────────────────────────────
  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    depends_on: [redis]
    networks: [app-net]
    restart: unless-stopped

  # ── Data Layer ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-knowledge_portal}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes: [redis_data:/data]
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  app-net:
    driver: bridge
