name: Build & Deploy to Droplet

# Builds the images the DigitalOcean droplet runs, pushes them to GHCR, and
# (optionally) tells the droplet to pull and restart.
#
# Nothing is built on the droplet itself: `next build` needs ~4 GB of RAM and
# the box has 957 Mi.
#
# TRIGGERS
#   push to main  -> builds only the images whose paths changed, then deploys
#   manual        -> you choose which images to build
#
# DEPLOY STEP
#   Active only once the repository secret DROPLET_SSH_KEY exists. Without it
#   the job logs a notice and exits cleanly, so builds keep working and the
#   droplet is simply updated by hand (`cd /opt/ckp && ./deploy.sh web`).
#
# Images (GHCR requires lowercase names):
#   ghcr.io/<owner>/creole-knowledge-portal-web:latest + :<sha>
#   ghcr.io/<owner>/creole-knowledge-portal-api:latest + :<sha>

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "shared/**"
      - "middleware.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "fetch-blogs/**"
      - ".github/workflows/deploy-droplet.yml"
  workflow_dispatch:
    inputs:
      build_web:
        description: Build and push the Next.js web image
        type: boolean
        default: true
      build_api:
        description: Build and push the fetch-blogs API/worker image
        type: boolean
        default: false
      base_path:
        description: NEXT_PUBLIC_BASE_PATH — leave EMPTY to serve the app at /
        type: string
        default: ""
      supabase_url:
        description: NEXT_PUBLIC_SUPABASE_URL (baked into the browser bundle)
        type: string
        default: "https://dgadpaytspsxttcqyzpb.supabase.co"

permissions:
  contents: read
  packages: write

# One deploy at a time, and never cancel a half-finished one — a cancelled
# build could leave :latest pointing at an image nobody verified.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      api: ${{ steps.f.outputs.api }}
      owner: ${{ steps.f.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: f
        run: |
          # GHCR rejects uppercase in image references; the org is "Creolestudios".
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "web=${{ inputs.build_web }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ inputs.build_api }}" >> "$GITHUB_OUTPUT"
            echo "manual run: web=${{ inputs.build_web }} api=${{ inputs.build_api }}"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^ HEAD || echo "")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          web=false; api=false
          echo "$CHANGED" | grep -qE '^(app/|components/|lib/|public/|shared/|middleware\.ts|next\.config\.ts|package\.json|package-lock\.json|Dockerfile)' && web=true
          echo "$CHANGED" | grep -qE '^fetch-blogs/' && api=true
          # a change to this workflow rebuilds the web image so it is never stale
          echo "$CHANGED" | grep -qE '^\.github/workflows/deploy-droplet\.yml$' && web=true

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "decision: web=$web api=$api"

  web:
    name: Web image (Next.js)
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ github.event_name == 'workflow_dispatch' && inputs.base_path || '' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ github.event_name == 'workflow_dispatch' && inputs.supabase_url || vars.SUPABASE_URL || 'https://dgadpaytspsxttcqyzpb.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/creole-knowledge-portal-web:latest
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/creole-knowledge-portal-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  api:
    name: API/worker image (fetch-blogs)
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: fetch-blogs
          file: fetch-blogs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/creole-knowledge-portal-api:latest
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/creole-knowledge-portal-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  deploy:
    name: Deploy to droplet
    needs: [plan, web, api]
    # run whenever at least one image was built successfully, and never if one failed
    if: >-
      always() &&
      needs.web.result != 'failure' && needs.api.result != 'failure' &&
      (needs.web.result == 'success' || needs.api.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check whether automatic deployment is configured
        id: gate
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Automatic deploy not configured::Add the DROPLET_SSH_KEY secret to enable it. Images are built and pushed; deploy by hand with 'cd /opt/ckp && ./deploy.sh web'."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ vars.DROPLET_HOST || '143.110.245.16' }}
          USER: ${{ vars.DROPLET_USER || 'ckpdeploy' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The droplet restricts this key to /opt/ckp/ci-deploy.sh via a forced
          # command, so the argument below is the only thing we control.
          MODE="web"
          if [ "${{ needs.api.result }}" = "success" ]; then MODE="blog"; fi
          echo "deploy mode: $MODE"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 "$USER@$HOST" "$MODE"

      - name: Smoke test
        if: steps.gate.outputs.enabled == 'true'
        run: |
          URL="${{ vars.PUBLIC_URL || 'https://ckp.csdev.site' }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/" || echo 000)
            echo "attempt $i: $URL -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error title=Smoke test failed::$URL did not return 200 after deploy"
          exit 1
