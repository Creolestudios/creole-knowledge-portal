# Shared proxy configuration for every CKP server block.
# Installed at /etc/nginx/snippets/ckp-common.conf and included by both the
# IP (self-signed) and domain (Let's Encrypt) listeners, so the two can never
# drift apart.

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:5m;
ssl_session_timeout 1h;

# Interview recordings stream through a Next.js API route in 3-second WebM
# chunks. Generous body size, and no request buffering so nginx does not spool
# uploads to disk on a box with little room to spare.
client_max_body_size    200m;
client_body_timeout     300s;
proxy_request_buffering off;

# Supabase session cookies are chunked JWTs totalling several KB. nginx's
# default proxy header buffer (4-8k) overflows on the /auth/callback response
# and returns 502 ("upstream sent too big header"), silently dropping the
# Set-Cookie headers so the user never gets logged in.
proxy_buffer_size           32k;
proxy_buffers             8 32k;
proxy_busy_buffers_size     64k;
# The same cookies come back on every later request; without this nginx
# answers 400 once a session exists.
large_client_header_buffers 4 32k;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        'upgrade';
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_cache_bypass $http_upgrade;

    # app/api/digests/generate/route.ts sets maxDuration = 600, and a cold
    # scrape->extract->rank->generate run on 1 vCPU takes minutes. A shorter
    # timeout returns 504 while the pipeline is still working.
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    # Next.js reports the container's bind address (0.0.0.0) in request.url,
    # so app/auth/callback/route.ts and middleware.ts emit
    # Location: https://0.0.0.0/... Rewrite those to the real host.
    # Proper fix is for the app to read X-Forwarded-Host.
    proxy_redirect https://0.0.0.0:3000/ https://$host/;
    proxy_redirect http://0.0.0.0:3000/  https://$host/;
    proxy_redirect https://0.0.0.0/      https://$host/;
    proxy_redirect http://0.0.0.0/       https://$host/;
}

# The FastAPI blog service is never exposed publicly: its only auth is the
# X-Internal-Token header, and the web app reaches it over the compose network.
location /api/v1/ {
    deny all;
    return 404;
}
