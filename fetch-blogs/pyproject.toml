[project]
name = "fetch-blogs"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # FastAPI
    "fastapi[standard]>=0.115.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "structlog>=24.0.0,<25.0.0",
    # MongoDB / Beanie ODM
    "motor>=3.4.0,<4.0.0",
    "beanie>=1.26.0,<2.0.0",
    # Redis + Celery
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    # Scraping
    "crawl4ai[all]>=0.3.0",
    "feedparser>=6.0.11,<7.0.0",
    # LLM + Embeddings
    "google-generativeai>=0.8.0",
    # Ranking
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    # Scheduling
    "apscheduler>=3.10.0,<4.0.0",
    # Quality gate
    "textstat>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.0.0",
    "mongomock-motor>=0.0.21",
    "mypy>=1.11.0,<2.0.0",
    "ruff>=0.6.0,<1.0.0",
    "coverage[toml]>=7.4.0,<8.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    # Type stubs
    "types-redis>=4.6.0",
    "types-beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking (moves type-only imports correctly)
    "ANN",  # flake8-annotations (flags missing return / param types)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length — handled by formatter
    "B008",    # Depends() in default — we use Annotated form
    "ANN401",  # Dynamically typed expressions (Any) — allow with comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]  # relax annotations in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "beanie.*",
    "motor.*",
    "crawl4ai.*",
    "feedparser.*",
    "textstat.*",
    "apscheduler.*",
    "google.generativeai.*",
    "sklearn.*",
    "structlog.*",
]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/config/source_registry.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

# ── pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
reportMissingImports = "none"
