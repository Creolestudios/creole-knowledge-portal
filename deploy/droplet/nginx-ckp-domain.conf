# CKP droplet — domain listener for ckp.csdev.site (Let's Encrypt)
#
# Install ONLY after the certificate exists, or nginx -t fails on the missing
# file:
#   certbot certonly --webroot -w /var/www/certbot -d ckp.csdev.site \
#     --agree-tos -m <ops-email> --non-interactive \
#     --deploy-hook "systemctl reload nginx"
#   cp nginx-ckp-domain.conf /etc/nginx/sites-available/ckp-domain
#   ln -sf /etc/nginx/sites-available/ckp-domain /etc/nginx/sites-enabled/ckp-domain
#   nginx -t && systemctl reload nginx
#
# Renewal is handled by the certbot systemd timer; the deploy hook reloads
# nginx when a new certificate is written. Check with:
#   certbot renew --dry-run
#   systemctl list-timers | grep certbot

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ckp.csdev.site;

    ssl_certificate     /etc/letsencrypt/live/ckp.csdev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ckp.csdev.site/privkey.pem;

    include /etc/nginx/snippets/ckp-common.conf;
}
