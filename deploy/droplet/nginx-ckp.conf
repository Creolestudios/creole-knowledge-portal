# CKP droplet — nginx reverse proxy
# Install to /etc/nginx/sites-available/ckp and symlink into sites-enabled.
#
# HTTPS is REQUIRED, not cosmetic: the interview module calls
# navigator.mediaDevices.getUserMedia() and MediaRecorder, and browsers expose
# those only in a secure context. Over plain HTTP the camera does not exist and
# the proctored interview cannot run at all.
#
# Interim cert: self-signed with the IP in subjectAltName. Testers accept the
# warning once. Replace with Let's Encrypt as soon as a real domain exists:
#   certbot --nginx -d portal.example.com
# (nip.io / sslip.io are NOT viable — not on the Public Suffix List, so Let's
# Encrypt's per-domain cap is shared across every user of those domains.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` is the pre-1.25.1 syntax. Ubuntu 22.04 ships nginx
    # 1.18.0, where the standalone `http2 on;` directive does not exist.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/ckp/fullchain.pem;
    ssl_certificate_key /etc/ssl/ckp/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # Interview recordings stream through a Next.js API route in 3-second WebM
    # chunks. Generous body size, and no request buffering so nginx does not
    # spool uploads to disk on a box with little room to spare.
    client_max_body_size      200m;
    client_body_timeout       300s;
    proxy_request_buffering   off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The FastAPI blog service is NEVER exposed publicly. Its only auth is the
    # X-Internal-Token header, and the web app reaches it over loopback.
    location /api/v1/ {
        deny all;
        return 404;
    }
}

# ── If you deploy an image built with NEXT_PUBLIC_BASE_PATH=/creole-knowledge-portal
# (for example the ECR image from deploy-app.yml), replace the `location /`
# block above with:
#
#     location = / { return 302 /creole-knowledge-portal; }
#
#     location /creole-knowledge-portal {
#         proxy_pass http://127.0.0.1:3000;
#         ... same proxy_set_header lines ...
#     }
