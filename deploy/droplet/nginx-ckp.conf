# CKP droplet — nginx reverse proxy (IP access + ACME challenge)
#
# Install:
#   cp nginx-ckp-common.conf /etc/nginx/snippets/ckp-common.conf
#   cp nginx-ckp.conf        /etc/nginx/sites-available/ckp
#   ln -sf /etc/nginx/sites-available/ckp /etc/nginx/sites-enabled/ckp
#   nginx -t && systemctl reload nginx
#
# The domain listener lives in nginx-ckp-domain.conf and is installed only
# after its Let's Encrypt certificate exists, otherwise nginx -t fails on the
# missing cert file.
#
# HTTPS is REQUIRED, not cosmetic: the interview module calls
# navigator.mediaDevices.getUserMedia() and MediaRecorder, which browsers
# expose only in a secure context.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 challenge must NOT be redirected. Note this has to be a
    # location: a server-level `return 301` runs in the server rewrite phase,
    # before location selection, and would hijack the challenge too.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Direct IP access, self-signed certificate. Kept as default_server so anyone
# holding the old https://143.110.245.16 link still reaches the app.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 143.110.245.16 _;

    ssl_certificate     /etc/ssl/ckp/fullchain.pem;
    ssl_certificate_key /etc/ssl/ckp/privkey.pem;

    include /etc/nginx/snippets/ckp-common.conf;
}
